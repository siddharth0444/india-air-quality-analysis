[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-quality"
version = "1.0.0"
description = "Lockdown, Diwali and seasonal effects on air quality in 26 Indian cities, 2015-2020"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Siddharth Rajak" }]
dependencies = ["pandas>=2.2", "numpy>=1.26", "matplotlib>=3.8", "seaborn>=0.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
